name: quality-gates

on:
  push:
    branches:
      - integration/2026-08-10
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - integration/2026-08-10
      - main

permissions:
  contents: read

env:
  MOCK_LLM: "true"
  # Windows runners must use UTF-8 because the suite emits Chinese text.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run Wave A lint contract
        run: python -X utf8 scripts/eval/wave_a_quality.py lint > "${{ runner.temp }}/lint-result.json"
      - name: Run Ruff correctness gate
        run: python -X utf8 -m ruff check scripts/eval tests/integration
      - name: Upload lint result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-lint-result
          path: ${{ runner.temp }}/lint-result.json
          if-no-files-found: error
          retention-days: 14

  type:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run Wave A type contract
        run: python -X utf8 scripts/eval/wave_a_quality.py type > "${{ runner.temp }}/type-result.json"
      - name: Upload type result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-type-result
          path: ${{ runner.temp }}/type-result.json
          if-no-files-found: error
          retention-days: 14

  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run offline unit suite
        run: python -X utf8 -m pytest -q --ignore=tests/integration --junitxml "${{ runner.temp }}/unit-junit.xml"
      - name: Upload unit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-unit-junit
          path: ${{ runner.temp }}/unit-junit.xml
          if-no-files-found: error
          retention-days: 14

  integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run offline integration fixture
        run: python -X utf8 -m pytest -q tests/integration --junitxml "${{ runner.temp }}/integration-junit.xml"
      - name: Upload integration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-integration-junit
          path: ${{ runner.temp }}/integration-junit.xml
          if-no-files-found: error
          retention-days: 14

  coverage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run full suite under coverage
        run: python -X utf8 -m coverage run --data-file "${{ runner.temp }}/coverage.data" -m pytest -q --junitxml "${{ runner.temp }}/coverage-junit.xml"
      - name: Enforce progressive coverage gate
        run: python -X utf8 -m coverage report --data-file "${{ runner.temp }}/coverage.data" --fail-under=65
      - name: Upload coverage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-coverage-junit
          path: ${{ runner.temp }}/coverage-junit.xml
          if-no-files-found: error
          retention-days: 14

  security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run project security audit
        run: python -X utf8 scripts/audit_project.py
      - name: Upload security audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-security-audit
          path: |
            exports/audit/audit_report.json
            exports/audit/audit_report.md
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Compile supported Python sources
        run: python -X utf8 -m compileall -q app scripts/eval
      - name: Create benchmark dry-run manifest
        run: python -X utf8 scripts/eval/benchmark_skeleton.py --dry-run --output "${{ runner.temp }}/benchmark.json"
      - name: Validate benchmark dry-run manifest
        run: python -X utf8 scripts/eval/wave_a_quality.py validate-result --result "${{ runner.temp }}/benchmark.json"
      - name: Upload build benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-build-benchmark
          path: |
            ${{ runner.temp }}/benchmark.json
            ${{ runner.temp }}/benchmark.csv
          if-no-files-found: error
          retention-days: 14

  # Render's native checksPass never fires: the org has no Render GitHub App
  # and the repo has no webhooks, so push/check events never reach Render.
  # After integration CI passes, trigger both preview services via the API.
  preview-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration/2026-08-10'
    needs: [lint, type, unit, integration, coverage, security, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      PREVIEW_API_SERVICE_ID: srv-d9pe8jm417fc73dnnirg
      PREVIEW_UI_SERVICE_ID: srv-d9pe8jm417fc73dnnisg
    steps:
      - name: Require Render API key
        run: |
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "RENDER_API_KEY repository secret is missing. Add a Dashboard API key (rnd_...) from https://dashboard.render.com/u/settings#api-keys"
            exit 1
          fi
      - name: Trigger Render preview deploys
        run: |
          set -euo pipefail
          deploy() {
            local name="$1"
            local id="$2"
            echo "Triggering ${name} (${id}) at ${GITHUB_SHA}"
            code="$(curl -sS -o /tmp/render-deploy.json -w "%{http_code}" \
              -X POST "https://api.render.com/v1/services/${id}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"commitId\":\"${GITHUB_SHA}\",\"clearCache\":\"do_not_clear\"}")"
            echo "HTTP ${code}"
            python3 -c "import json; d=json.load(open('/tmp/render-deploy.json')); deploy=d.get('deploy', d); print('deploy_id', deploy.get('id'), 'status', deploy.get('status'), 'commit', (deploy.get('commit') or {}).get('id'))"
            case "${code}" in
              200|201|202) ;;
              *) echo "Render deploy trigger failed for ${name}"; exit 1 ;;
            esac
          }
          deploy sage125-api-preview "${PREVIEW_API_SERVICE_ID}"
          deploy sage125-ui-preview "${PREVIEW_UI_SERVICE_ID}"
