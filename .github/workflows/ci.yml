name: quality-gates

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - integration/2026-08-10

permissions:
  contents: read

env:
  MOCK_LLM: "true"
  # Windows runners must use UTF-8 because the suite emits Chinese text.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run Wave A lint contract
        run: python -X utf8 scripts/eval/wave_a_quality.py lint

  type:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run Wave A type contract
        run: python -X utf8 scripts/eval/wave_a_quality.py type

  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run offline unit suite
        run: python -X utf8 -m pytest -q --ignore=tests/integration

  integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run offline integration fixture
        run: python -X utf8 -m pytest -q tests/integration

  security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run project security audit
        run: python -X utf8 scripts/audit_project.py

  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Compile supported Python sources
        run: python -X utf8 -m compileall -q app scripts/eval
      - name: Create benchmark dry-run manifest
        run: python -X utf8 scripts/eval/benchmark_skeleton.py --dry-run --output "${{ runner.temp }}/benchmark.json"
      - name: Validate benchmark dry-run manifest
        run: python -X utf8 scripts/eval/wave_a_quality.py validate-result --result "${{ runner.temp }}/benchmark.json"
