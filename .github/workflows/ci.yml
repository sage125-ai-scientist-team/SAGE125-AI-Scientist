name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test suite
        env:
          MOCK_LLM: "true"
          # Windows runner default code page cannot encode Chinese smoke output.
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -X utf8 -m pytest -q
