name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test suite
        env:
          MOCK_LLM: "true"
        run: python -m pytest -q
