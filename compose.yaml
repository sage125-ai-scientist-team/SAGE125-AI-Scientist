name: sage125

x-runtime-hardening: &runtime-hardening
  image: sage125-ai-scientist:wave-c
  build:
    context: .
    dockerfile: Dockerfile
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m
  restart: unless-stopped

services:
  api:
    <<: *runtime-hardening
    command: ["python", "-m", "scripts.start_api"]
    environment:
      APP_ENV: container
      PORT: "8000"
      DATA_DIR: /opt/sage125/data
      EXPORT_DIR: /var/lib/sage125/exports
      T06_MULTIMODAL_STORE_DIR: /var/lib/sage125/multimodal
      PREVIEW_EPHEMERAL_STORAGE: "false"
      SAGE125_PREVIEW_SEED: "1"
      LOG_LEVEL: INFO
      CORS_ALLOW_ORIGINS: http://127.0.0.1:8501,http://localhost:8501
      SAGE_API_KEYS_JSON: '{"local-demo":"${SAGE125_DEMO_API_KEY:-local-demo-key-change-me}","isolation-probe":"${SAGE125_ISOLATION_API_KEY:-local-isolation-key-change-me}"}'
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      WORKSPACE_ID: "${WORKSPACE_ID:-}"
      HOME: /tmp/sage-home
      XDG_CACHE_HOME: /tmp/sage-home/.cache
      XDG_CONFIG_HOME: /tmp/sage-home/.config
    ports:
      - "127.0.0.1:${SAGE125_API_PORT:-8000}:8000"
    volumes:
      - sage125-data:/opt/sage125/data
      - sage125-exports:/var/lib/sage125/exports
      - sage125-multimodal:/var/lib/sage125/multimodal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import sys
          import urllib.request
          body = json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5))
          deps = body.get("dependencies", {})
          ready = (
              body.get("status") == "ok"
              and body.get("storage", {}).get("persistent") is True
              and all(
                  deps.get(name) == "available"
                  for name in ("job_store", "artifact_registry", "artifact_storage")
              )
          )
          sys.exit(0 if ready else 1)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s

  ui:
    <<: *runtime-hardening
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
      - --client.showErrorDetails
      - "false"
      - --browser.gatherUsageStats
      - "false"
    environment:
      SAGE_UI_API_BASE_URL: http://api:8000
      SAGE_UI_API_KEY: "${SAGE125_DEMO_API_KEY:-local-demo-key-change-me}"
      SAGE_UI_TIMEOUT_SECONDS: "10"
      HOME: /tmp/sage-home
      XDG_CACHE_HOME: /tmp/sage-home/.cache
      XDG_CONFIG_HOME: /tmp/sage-home/.config
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${SAGE125_UI_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          import urllib.request
          response = urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=5)
          sys.exit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 45s
    stop_grace_period: 20s

volumes:
  sage125-data:
  sage125-exports:
  sage125-multimodal:
