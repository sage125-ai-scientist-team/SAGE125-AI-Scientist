# ============================================================
# SAGE125 AI Scientist —— Streamlit 全局主题（深色科学工作台）
# 作用：与 app/ui/style.css 双重固定深色主题，避免交互后主背景变白。
# ============================================================

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#0B1628"
textColor = "#E5EEF9"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
headless = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
