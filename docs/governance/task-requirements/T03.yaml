schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T03
title: T03. 队员 3（姓名待填）— 人在回路、SchemaValidator 与质量门闭环
mission: 确保人工反馈真正改变下一轮输入，并让 Validator/质量门基于完整产物执行可阻断验证，而不是仅记录意见或只检查题目。
scoring_dimensions:
- 反馈迭代
- 科学真实性
- 应用稳定性
owner_paths:
- app/feedback/**
- app/validation/**
- app/quality/**
- app/contracts/validation.py
- tests/validation/**
- docs/modules/T03/**
forbidden_paths:
- 不直接重构 pipeline.py 或 API 路由
- 向 T02/T08 提供稳定接口
dependencies:
  raw: 上游 T01；与 T02/T08 双向联调；下游 T07。
  upstream:
  - T01
  - T02
  - T08
  downstream:
  - T07
branch_series:
- t03/a-validation-contract
- t03/b-validation-core
- t03/c-validation-hardening
paired_reviewer: T02
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- FeedbackRecord、FeedbackDecision、ValidationContext、GateResult、Severity 和 audit lineage。
- 人工意见进入下一轮；系统可接受、部分接受或拒绝并给出可审计理由。
- Validator 同时接收 ResearchPlan、EvidenceCards、AgentTrace、execution_metadata 和 question_item；缺字段、虚构引用、错误 actual_execution、串题等均可阻断。
definition_of_done:
- 下一轮 prompt 可找到 feedback_id 和具体意见，输出变化或给出可审计拒绝理由。
- P0/P1 未解决时 validation_status 不得为 passed。
- 至少 10 个无效输入、恶意反馈、缺失产物和并发失败用例；审计链不可丢失。
quantitative_thresholds:
- requirement_id: T03-METRIC-001
  raw_text: 至少 10 个
  comparator: at_least
  value: 10
  unit: 个
  source_requirement_id: T03-DOD-003
- requirement_id: T03-METRIC-002
  raw_text: 12 个
  comparator: quantity
  value: 12
  unit: 个
  source_requirement_id: T03-C-001
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与基线复现
      work: 完成协作接入；复现 feedback 只写历史、Validator 只收到 question_item 的问题；盘点现有质量门和状态字段。
      deliverable: 失败样例；Validator 输入矩阵；T03 审计笔记。
      evidence: 旧链路问题可重复；分支从最新 integration 创建。
    - date: 07/28（周二）
      focus: 契约与红灯测试
      work: 设计 FeedbackRecord、FeedbackDecision、ValidationContext、GateResult、Severity 和 lineage；编写反馈传播、完整输入和阻断规则红灯测试；开启 Draft PR-A。
      deliverable: 接口 RFC；JSON 示例；红灯测试；Draft PR-A。
      evidence: 字段覆盖版本、来源、决策和审计；旧代码稳定失败。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 实现 Schema、存储适配和服务接口；与 T02/T08 对齐；同步 integration、模块/契约测试，20:00 前转 Ready。
      deliverable: PR-A Ready；接口冻结记录。
      evidence: T02/T08 可依契约开发；无 pipeline/API 越权修改。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 反馈持久化
      work: 新建 B 分支；实现保存、去重、权限与输入长度校验、版本关联和幂等请求。
      deliverable: FeedbackService。
      evidence: 重复请求不重复写入；非法输入安全失败。
    - date: 07/31（周五）
      focus: RevisionContext
      work: 将有效反馈结构化为下一轮输入；支持接受、部分接受、拒绝和理由；保留 feedback_id 与原始版本。
      deliverable: RevisionContext builder。
      evidence: 反馈决策和来源可追溯。
    - date: 08/01（周六）
      focus: 完整 Validator 与 Draft PR-B
      work: 让 Validator 验证计划、证据、轨迹、执行元数据和问题项；实现严重级别、阻断状态机和 gate 聚合；开启 Draft PR-B。
      deliverable: ValidationContext validator；Gate aggregator；Draft PR-B。
      evidence: 缺一关键对象即失败；P0/P1 不误放行。
    - date: 08/02（周日）
      focus: 审计链与攻击测试
      work: 记录反馈→版本→差异→关闭状态；增加 prompt injection、超长/空反馈、非法 ID、重复与并发提交用例。
      deliverable: Audit lineage；安全失败用例。
      evidence: 攻击输入不污染后续版本；审计链可查询。
    - date: 08/03（周一）
      focus: T02/T08 联调
      work: 完成 T02 配对审查；对接 feedback API、恢复运行和版本事件；补接口契约、错误码和迁移测试。
      deliverable: 联调提交；配对审查记录。
      evidence: 反馈不再只是日志；API 幂等。
    - date: 08/04（周二）
      focus: E2E 与质量指标
      work: 运行“提交反馈→恢复→新版本→验证”E2E；输出 gate 通过率、错误类型和修订关闭率，供 T08/T09 使用。
      deliverable: E2E 演示记录；metrics payload。
      evidence: 输出变化或可审计拒绝；指标按题/版本聚合。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步 integration、运行状态转换/安全/集成测试；补迁移、回滚和限制；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；测试报告。
      evidence: 状态转换全覆盖；P0/P1 关闭；分支 up to date。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 跨领域校准
      work: 新建 C 分支；对 12 个代表题运行 Schema/质量门，校正过严或过松规则；补并发、恶意输入和缺产物回归；开启 Draft PR-C。
      deliverable: 校准报告；Draft PR-C。
      evidence: 不存在普遍误阻断或缺输入仍通过。
    - date: 08/07（周五）
      focus: 发布联调
      work: 完成 API 契约、迁移、运维文档、错误码和指标说明；与 T07 批量 gate 联调；处理 Codex/配对审查。
      deliverable: 接口文档；审查修订提交。
      evidence: 批量失败题不进入 complete；无未登记共享改动。
    - date: 08/08（周六）
      focus: 冻结前审计
      work: 抽查旗舰、Q028 和批量输出的 Validator 输入与阻断结果；同步 integration、全测试、@codex review，18:00 前转 Ready。
      deliverable: 冻结审计表；PR-C Ready。
      evidence: 无“缺输入仍通过”；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: Code Freeze 与交接
  work: 只处理队长、CI 或 Codex 指出的发布阻断；不得新增功能、改名公共接口、升级依赖或继续使用已合并旧分支。完成 handoff、复现命令、PR 链接、已知限制与回滚说明。
  deliverable: 阻断修复或“无变更”确认；最终 handoff 包。
  evidence: 无新增范围；P0/P1 关闭或由队长登记阻断；交付可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不直接重构 pipeline.py 或 API 路由；向 T02/T08 提供稳定接口。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
