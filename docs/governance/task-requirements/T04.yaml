schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T04
title: T04. 队员 4（姓名待填）— RAG 索引统一、全文检索与证据源治理
mission: 消除新旧索引路径不一致，统一检索配置，保证问题册不被当作论文证据，并向证据链提供带页码的真实全文片段。
scoring_dimensions:
- 科学事实准确性
- 知识整合
- 检索效果
- 可复现性
owner_paths:
- app/rag/**
- app/contracts/rag.py
- tests/rag/**
- docs/modules/T04/**
forbidden_paths:
- 不负责事实支持判定（T01），不直接修改工作流状态机（T02）
dependencies:
  raw: 上游外部文献/数据源；下游 T01。
  upstream: []
  downstream:
  - T01
branch_series:
- t04/a-rag-contract
- t04/b-rag-core
- t04/c-rag-hardening
paired_reviewer: T01
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- 唯一 IndexConfig 和索引根路径；旧路径迁移、回滚和健康检查；Supervisor/LibraryManager 读取同一配置。
- 论文、问题册、网页、数据集等 source_type 治理；问题册不得进入论文证据集合。
- PDF 全文页码/章节解析、DOI+内容哈希去重、缓存、原子重建、损坏恢复，以及 30 查询检索黄金集。
definition_of_done:
- 系统不存在 data/index/zvec 与 data/index/user_library/zvec 双重真相。
- 检索结果含全文片段、页码/章节、来源类型和哈希；问题册仅作问题输入。
- 30 查询 recall@10 目标不低于 0.80；空索引、损坏索引、并发重建和迁移失败均安全处理。
quantitative_thresholds:
- requirement_id: T04-METRIC-001
  raw_text: 30 查询
  comparator: quantity
  value: 30
  unit: 查询
  source_requirement_id: T04-MUST-003
- requirement_id: T04-METRIC-002
  raw_text: 30 查询
