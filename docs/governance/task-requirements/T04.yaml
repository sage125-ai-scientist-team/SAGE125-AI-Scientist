- requirement_id: T04-METRIC-005
  raw_text: 30 查询
  comparator: quantity
  value: 30
  unit: 查询
  source_requirement_id: T04-B-013
- requirement_id: T04-METRIC-006
  raw_text: 12 领域
  comparator: quantity
  value: 12
  unit: 领域
  source_requirement_id: T04-C-007
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与 RAG 审计
      work: 完成协作接入；复现 Supervisor/LibraryManager 路径不一致与问题册污染；记录索引结构、调用方和失败路径。
      deliverable: RAG 审计；失败测试；T04 任务笔记。
      evidence: 两类问题可重复；任务分支来自最新 integration。
    - date: 07/28（周二）
      focus: 配置契约与红灯测试
      work: 设计唯一 IndexConfig、source_type、迁移策略和 20 个初始检索查询；编写路径分裂、问题册污染和缺页码红灯测试；开启 Draft PR-A。
      deliverable: 配置 RFC；初始 gold set；Draft PR-A。
      evidence: 所有调用方有明确接口；旧代码稳定失败。
    - date: 07/29（周三）
      focus: 路径统一与 PR-A
      work: 实现共享配置，修复 Supervisor/LibraryManager，提交迁移命令、兼容警告和回滚；同步 integration、测试，20:00 前转 Ready。
      deliverable: PR-A Ready；迁移命令。
      evidence: 新旧组件指向唯一路径；迁移可回滚。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 来源类型治理
      work: 新建 B 分支；实现论文、问题册、数据集和网页分类；排除问题册进入 evidentiary corpus。
      deliverable: SourcePolicy。
      evidence: 问题册只能作为问题上下文，不能支持科学事实。
    - date: 07/31（周五）
      focus: 全文解析
      work: 保留 PDF 页码、章节、作者、摘要、DOI/URL、quote 和内容哈希；处理扫描件、空页和解析失败。
      deliverable: document loader v2。
      evidence: T01 可获得可定位片段；失败有明确状态。
    - date: 08/01（周六）
      focus: 去重、缓存与 Draft PR-B
      work: 实现 DOI+内容哈希去重、解析缓存、原子写入和索引重建骨架；开启 Draft PR-B。
      deliverable: dedupe/cache/rebuild 模块；Draft PR-B。
      evidence: 重复入库不产生重复 chunk；中断不破坏现有索引。
    - date: 08/02（周日）
      focus: 损坏与并发恢复
      work: 增加空索引、损坏索引、并发重建、锁超时和迁移失败测试；实现安全恢复。
      deliverable: recovery tests；健康状态。
      evidence: 失败不污染索引；现有索引可回退。
    - date: 08/03（周一）
      focus: 检索调优与配对审查
      work: 实现 query expansion、top-k、年份/领域过滤和来源优先级；完成 T01 配对审查；扩展黄金集至 30 查询。
      deliverable: 检索配置实验；30-query gold set。
      evidence: 相关性有量化对比；标注可审计。
    - date: 08/04（周二）
      focus: 评测与多模态接入
      work: 运行 recall@10、MRR、延迟、缓存命中；整理失败查询；接入 T06 表格/图像/时序元数据但不将二进制直接塞入文本索引。
      deliverable: 评测报告；multimodal index adapter。
      evidence: 来源、坐标和单位不丢失；未达标查询有错误分析。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步 integration、运行模块/契约/E2E；补迁移、健康检查和回滚文档；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；检索指标。
      evidence: recall@10 达标或有整改清单；P0/P1 关闭。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 安全与性能加固
      work: 新建 C 分支；增加恶意 PDF、超大文件、路径穿越、损坏元数据、超时、并发检索和确定性测试；20:00 前开启 Draft PR-C。
      deliverable: 安全测试；性能报告；Draft PR-C。
      evidence: 失败不污染索引；同版本同查询结果稳定。
    - date: 08/07（周五）
      focus: 干净重建与文档
      work: 从空目录重建索引，完成迁移文档、诊断命令、索引健康检查和复现步骤；处理审查。
      deliverable: clean rebuild report；诊断命令。
      evidence: 干净环境可一键构建；无本地硬编码路径。
    - date: 08/08（周六）
      focus: 冻结前评测
      work: 抽查 12 领域和旗舰案例，确认无题册污染、无重复文献和定位字段完整；同步 integration、全测试、@codex review，18:00 前转 Ready。
      deliverable: 索引清单；PR-C Ready。
      evidence: P0/P1 关闭；索引可发布。
code_freeze:
  date: 08/09（周日）
  focus: Code Freeze 与交接
  work: 只处理队长、CI 或 Codex 指出的发布阻断；不得新增功能、改名公共接口、升级依赖或继续使用已合并旧分支。完成 handoff、复现命令、PR 链接、已知限制与回滚说明。
  deliverable: 阻断修复或“无变更”确认；最终 handoff 包。
  evidence: 无新增范围；P0/P1 关闭或由队长登记阻断；交付可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不负责事实支持判定（T01），不直接修改工作流状态机（T02）。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
