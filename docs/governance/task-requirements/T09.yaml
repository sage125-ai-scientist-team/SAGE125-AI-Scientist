schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T09
title: T09. 队员 9（姓名待填）— CI、评测消融、复现工程与提交材料质量控制
mission: 建立所有 PR 的自动化质量门禁、跨领域评测和消融基线，并完成可复现、可审计、可打包的发布工程。
scoring_dimensions:
- 代码与结果可复现
- 技术证明
- 提交完整性
owner_paths:
- .github/workflows/**
- tests/integration/**
- scripts/eval/**
- docs/reproducibility/**
- pyproject.toml/requirements/锁文件
- LICENSE/SBOM
forbidden_paths:
- 不得降低测试标准来让 PR 变绿
- 共享依赖变更须经队长批准
- 不替代各任务单测
dependencies:
  raw: 横向服务所有任务；向队长提供 CI、评测和发布门禁。
  upstream: []
  downstream: []
branch_series:
- t09/a-quality-contract
- t09/b-quality-core
- t09/c-quality-hardening
paired_reviewer: 队长 + 受影响模块 owner
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- GitHub Actions：lint/type/unit/integration/security/build，固定 job 名称与测试产物。
- 无 RAG、无 Reviewer、无 HITL、单智能体、完整系统消融；引用正确率、幻觉率、可证伪性、可执行性、迭代提升、延迟/token/成本。
- 依赖锁、LICENSE、SBOM/checksum、干净环境复现、旧 Mock/测试/失败 exports 清理、提交包校验器和 release notes。
definition_of_done:
- 所有合并通过固定检查；不得通过删除断言、跳过 job 或重命名规避失败。
- 完整系统与至少 4 个消融基线使用同一题集和评分协议，结果可复跑。
- 发布包无 API key、无许可数据、旧 Mock/测试残留；从 clone 到核心冒烟可按文档完成。
quantitative_thresholds:
- requirement_id: T09-METRIC-001
  raw_text: 至少 4 个
  comparator: at_least
  value: 4
  unit: 个
  source_requirement_id: T09-DOD-002
- requirement_id: T09-METRIC-002
  raw_text: 12 领域
  comparator: quantity
  value: 12
  unit: 领域
  source_requirement_id: T09-B-016
- requirement_id: T09-METRIC-003
  raw_text: 20 页
  comparator: quantity
  value: 20
  unit: 页
  source_requirement_id: T09-C-001
- requirement_id: T09-METRIC-004
  raw_text: 125 文件
  comparator: quantity
  value: 125
  unit: 文件
  source_requirement_id: T09-C-001
- requirement_id: T09-METRIC-005
  raw_text: 12 领域
  comparator: quantity
  value: 12
  unit: 领域
  source_requirement_id: T09-C-007
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与质量基线
      work: 完成协作接入；盘点测试、CI、依赖、文档和 exports；记录当前 208 passed/35 skipped/7 failed 基线，定义稳定的 required check 名称与 owner。
      deliverable: QA 基线；检查矩阵；T09 审计笔记。
      evidence: 现有通过率与失败原因明确；分支来自最新 integration。
    - date: 07/28（周二）
      focus: CI/评测契约与 Draft PR-A
      work: 定义 lint/type/unit/integration/security/build、科学指标、消融协议、release manifest 和 DoD；建立基础 workflow、artifact 上传和 benchmark skeleton；开启 Draft PR-A。
      deliverable: Evaluation RFC；CI skeleton；Draft PR-A。
      evidence: PR 能触发稳定 job 名；接口可供各任务接入。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 提交 CI、离线夹具、PR 检查说明和失败产物；同步 integration、验证 workflow，20:00 前转 Ready。
      deliverable: PR-A Ready；CI 运行链接。
      evidence: 队长可用固定检查；失败不被隐藏。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 静态质量与集成夹具
      work: 新建 B 分支；接入 Ruff、类型检查、覆盖率渐进阈值、固定 Python 版本；构建离线/低成本 E2E fixture。
      deliverable: lint/type jobs；integration harness。
      evidence: 不通过删除检查规避历史问题；fixture 不泄密。
    - date: 07/31（周五）
      focus: 安全与供应链
      work: 增加秘密扫描、依赖审计、数据许可和产物 checksum；确定锁文件策略、LICENSE 与 SBOM 方案。
      deliverable: security jobs；SBOM/lock 方案。
      evidence: 示例密钥和无许可数据可被检测。
    - date: 08/01（周六）
      focus: 清理与 Draft PR-B
      work: 实现旧 Mock/测试/失败 exports 清理与 release 排除规则；开启 Draft PR-B；完成受影响模块配对审查。
      deliverable: cleaning validator；Draft PR-B；审查记录。
      evidence: 旧产物不进入 release；依赖变更有队长批准。
    - date: 08/02（周日）
      focus: 黄金集与评分协议
      work: 整合 T01/T04/T06 gold set，定义引用、检索、多模态、闭环和成本指标；固化同题集评分协议。
      deliverable: eval datasets；metrics schema。
      evidence: 版本、许可和计算方式清楚。
    - date: 08/03（周一）
      focus: 消融初跑
      work: 运行 no-RAG、no-reviewer、no-HITL、single-agent 初始基线；保存原始 JSON/CSV 和环境。
      deliverable: ablation raw results。
      evidence: 所有配置使用同一题集和协议；结果可重复。
    - date: 08/04（周二）
      focus: 跨领域评测
      work: 运行 12 领域样例，统计通过率、稳定性、引用正确率和迭代改善；生成聚合脚本和图表。
      deliverable: 12-domain report；aggregation scripts。
      evidence: 失败类型可定位到任务 owner。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步 integration、运行完整 CI、评测和安全检查；补成本/延迟统计；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；评测报告 v1。
      evidence: 报告可一键再生成；P0/P1 关闭。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 干净复现与打包校验
      work: 新建 C 分支；在新环境 clone/install/test/run，补故障排除；实现 20 页文档、125 文件、API 说明、凭证清单和 checksums 校验；开启 Draft PR-C。
      deliverable: clean-room report；packaging validator；Draft PR-C。
      evidence: 无隐含本地路径；缺材料明确失败。
    - date: 08/07（周五）
      focus: 发布材料联调
      work: 整合技术方案数据表、Qwen/百炼调用凭证清单、125 manifest、重复/Mock/secret 扫描和 release notes。
      deliverable: RC validation v1；材料缺口表。
      evidence: 不写入真实密钥；旧产物不混入。
    - date: 08/08（周六）
      focus: 全量 CI 与 RC 验证
      work: 运行 full CI、12 领域评测、125 manifest 校验、随机抽查与安全扫描；同步 integration、@codex review，18:00 前转 Ready。
      deliverable: RC validation final；PR-C Ready。
      evidence: P0/P1 关闭；发布候选可复现、可审计。
code_freeze:
  date: 08/09（周日）
  focus: 最终 QA 与交接
  work: 只修发布阻断；生成 checksums、DoD 汇总、最终 QA 报告和 handoff，核对九项任务验收证据。
  deliverable: 最终 QA 报告；checksums；handoff。
  evidence: 发布包完整、无敏感或无许可内容；所有未通过项明确阻断。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不得降低测试标准来让 PR 变绿；共享依赖变更须经队长批准；不替代各任务单测。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
