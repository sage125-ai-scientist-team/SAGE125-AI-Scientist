schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T02
title: T02. 队员 2（姓名待填）— Reviewer 驱动的真实迭代与工作流版本化
mission: 将形式上的重复调用改造成评审意见真正进入下一轮、版本差异可解释、评分与问题关闭状态可追踪的科研迭代状态机。
scoring_dimensions:
- 科学价值
- 多智能体协作
- 反馈迭代稳定性
owner_paths:
- app/workflow/**（含 pipeline.py 唯一修改权）
- app/contracts/revision.py
- tests/workflow/**
- docs/modules/T02/**
forbidden_paths:
- 不得重写 T01/T03/T05/T06 的内部实现
- 仅通过冻结契约调用
dependencies:
  raw: 上游 T01、T03、T05、T06；下游 T07、T08。
  upstream:
  - T01
  - T03
  - T05
  - T06
  downstream:
  - T07
  - T08
branch_series:
- t02/a-revision-contract
- t02/b-revision-core
- t02/c-revision-hardening
paired_reviewer: T03
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- ReviewFeedback、RevisionContext、PlanVersion、IssueClosure 与序列化；prompt hash、lineage 和评分变化可追溯。
- critical_issues、required_revisions、comments 真正进入下一轮假设和实验设计。
- 最大迭代、无改进停止、失败重试、幂等恢复、人工暂停/继续，以及至少一个真实两轮案例。
definition_of_done:
- Reviewer 不通过后，下一轮输入与 prompt_hash 必须变化，并可定位到具体意见。
- 每条 required_revision 有关闭状态；未解决 P0 不得放行。
- 超时、重复回调和 LLM 失败不产生重复版本或无限循环；前端/导出可展示 V1/V2 差异和停止原因。
quantitative_thresholds:
- requirement_id: T02-METRIC-001
  raw_text: 至少一个
  comparator: at_least
  value: 1
  unit: 个
  source_requirement_id: T02-MUST-003
- requirement_id: T02-METRIC-002
  raw_text: 至少 4 个
  comparator: at_least
  value: 4
  unit: 个
  source_requirement_id: T02-A-006
- requirement_id: T02-METRIC-003
  raw_text: 1 问题
  comparator: quantity
  value: 1
  unit: 问题
  source_requirement_id: T02-B-018
- requirement_id: T02-METRIC-004
  raw_text: 3 个
  comparator: quantity
  value: 3
  unit: 个
  source_requirement_id: T02-C-007
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与状态机审计
      work: 完成 Fork 协作接入；复现 HypothesisGenerator、ExperimentDesigner、Reviewer 两轮 prompt_hash 相同的问题；绘制当前状态机与数据流。
      deliverable: 失败轨迹；现状状态图；T02 审计笔记。
      evidence: 旧流程问题可重复；分支起点为最新 integration。
    - date: 07/28（周二）
      focus: 契约与红灯测试
      work: 设计 ReviewFeedback、RevisionContext、PlanVersion、IssueClosure 和扩展 hook；与 T03/T05/T06 对齐；编写意见注入、hash 变化、版本递增和停止条件红灯测试；开启 Draft PR-A。
      deliverable: 接口 RFC；红灯测试；Draft PR-A。
      evidence: 至少 4 个旧流程测试稳定失败；接口不泄漏其他模块实现。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 实现状态对象、prompt builder 骨架、版本存储和兼容迁移；明确 pipeline.py 修改范围；同步 integration、测试并在 20:00 前转 Ready。
      deliverable: PR-A Ready；接口冻结记录。
      evidence: 状态可序列化；新 push 后重新审查；无跨 owner 重写。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: Reviewer 意见注入
      work: 从最新 integration 新建 B 分支；将 critical_issues、required_revisions、comments 和 issue_id 注入下一轮假设生成。
      deliverable: Hypothesis revision prompt。
      evidence: trace 可定位意见来源；输入 hash 发生合理变化。
    - date: 07/31（周五）
      focus: 实验方案修订
      work: 让 ExperimentDesigner 读取评审意见、上一版实验、未关闭问题和失败原因；生成可解释修订理由。
      deliverable: Experiment revision prompt；问题关闭映射。
      evidence: 实验设计发生实质变化，而不是仅改措辞。
    - date: 08/01（周六）
      focus: 版本、差异与 Draft PR-B
      work: 生成 V1/V2 结构化 diff、issue closure、评分变化和 lineage；实现最大轮数、无改进停止、人工暂停和重试；开启 Draft PR-B。
      deliverable: 版本服务；停止策略；Draft PR-B。
      evidence: 一次迭代可完整回放；无无限循环。
    - date: 08/02（周日）
      focus: 幂等与恢复
      work: 测试超时、空 reviewer、重复事件、断点恢复和重复提交；确保失败不产生重复版本。
      deliverable: 稳定性测试报告。
      evidence: 重复回调幂等；失败可恢复且有停止原因。
    - date: 08/03（周一）
      focus: T01/T03 联调
      work: 接入 EvidenceBundle 与人工反馈 RevisionContext；完成 T03 配对审查；补充契约与迁移测试。
      deliverable: 联调提交；配对审查记录。
      evidence: 评审与人工反馈均进入下一轮；字段兼容有测试。
    - date: 08/04（周二）
      focus: 真实两轮 E2E
      work: 运行一个真实或准真实两轮案例，核对输入、输出、hash、版本、评分和问题关闭；补 candidate hypothesis 排名。
      deliverable: 两轮 trace；差异报告；排名结果。
      evidence: V2 明确回应 V1 问题；差异可解释。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步最新 integration，运行全测试与最小 E2E；补齐 trace 导出、迁移和回滚；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；可复现案例包。
      evidence: 关键链路可复现；P0/P1 关闭；分支 up to date。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 执行/多模态入口
      work: 新建 C 分支；接入 T05 ExecutionResult 和 T06 MultimodalArtifact 的摘要、指标、失败原因、单位与置信度；避免大对象污染 prompt；开启 Draft PR-C。
      deliverable: execution/multimodal feedback hooks；Draft PR-C。
      evidence: 实际结果可改变下一轮计划；来源信息完整。
    - date: 08/07（周五）
      focus: API 与稳定性联调
      work: 向 T08 暴露版本、issue、diff、状态事件与停止原因；执行幂等、超时、空结果和恢复测试；处理 Codex/配对审查。
      deliverable: API 合约；稳定性修订提交。
      evidence: 前端无需解析内部对象；无未登记共享文件冲突。
    - date: 08/08（周六）
      focus: 冻结前回归
      work: 对 Q028、旗舰案例和 3 个随机题运行全链路回归；同步 integration、全测试、@codex review，18:00 前转 Ready。
      deliverable: 回归矩阵；PR-C Ready。
      evidence: 无相同 prompt_hash 假迭代；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: Code Freeze 与交接
  work: 只处理队长、CI 或 Codex 指出的发布阻断；不得新增功能、改名公共接口、升级依赖或继续使用已合并旧分支。完成 handoff、复现命令、PR 链接、已知限制与回滚说明。
  deliverable: 阻断修复或“无变更”确认；最终 handoff 包。
  evidence: 无新增范围；P0/P1 关闭或由队长登记阻断；交付可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不得重写 T01/T03/T05/T06 的内部实现；仅通过冻结契约调用。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
