schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T05
title: T05. 队员 5（姓名待填）— 真实实验执行器、结果分析与可复现实验闭环
mission: 将“只设计实验”升级为至少一个旗舰问题能够加载真实数据、运行代码、产生指标和图表，并让 Round 1 结果改变 Round 2 方案。
scoring_dimensions:
- 方案落地验证
- 技术深度
- 科研闭环
- 可复现性
owner_paths:
- app/execution/**
- app/contracts/execution.py
- tests/execution/**
- experiments/flagship/**
- docs/modules/T05/**
forbidden_paths:
- 不得把模拟指标写成真实结果
- 不直接修改 pipeline.py，通过 ExecutionResult 交给 T02
dependencies:
  raw: 上游 T02；下游 T02、T07、T08、T09。
  upstream:
  - T02
  downstream:
  - T02
  - T07
  - T08
  - T09
branch_series:
- t05/a-execution-contract
- t05/b-execution-core
- t05/c-execution-hardening
paired_reviewer: T06
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- ExecutionSpec、ExecutionResult、ArtifactManifest、DatasetManifest 和最小权限运行器。
- 超时、资源限制、命令/路径白名单、种子、环境、依赖版本、stdout/stderr、指标、图表和校验和。
- actual_execution=true 严格守卫；旗舰案例完成 Round 1→分析→修改→Round 2 的真实闭环。
definition_of_done:
- 从干净环境按文档可复现；数据来源、许可、版本和 SHA-256 明确。
- 失败、超时、缺依赖和非法路径不得报告为成功；不得虚构 AUROC/准确率。
- Round 2 明确受 Round 1 结果影响，日志、指标、种子、环境与 Git commit 全部可追溯。
quantitative_thresholds: []
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与旗舰定题
      work: 完成协作接入；与队长确定旗舰问题、公开数据、基线、成功指标和运行环境；盘点执行缺口与安全风险。
      deliverable: Execution RFC；数据清单；风险清单。
      evidence: 问题可在本地或云端真实运行；数据许可可核验。
    - date: 07/28（周二）
      focus: 安全契约与运行器骨架
      work: 设计 ExecutionSpec/Result/Artifact/DatasetManifest、威胁模型、超时/资源/路径限制；实现隔离工作目录、命令入口和日志捕获；开启 Draft PR-A。
      deliverable: 接口与安全清单；runner skeleton；Draft PR-A。
      evidence: actual_execution 规则明确；no-op/失败夹具可运行。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 实现沙箱骨架、stdout/stderr、超时、清理和基础测试；同步 integration、契约/安全测试，20:00 前转 Ready。
      deliverable: PR-A Ready；安全测试报告。
      evidence: 不依赖生产密钥；非法路径被阻断。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 数据适配
      work: 新建 B 分支；实现下载/加载、许可、版本、checksum、缓存和缺失处理；固定公开数据快照。
      deliverable: DatasetManifest + adapter。
      evidence: 数据来源合规，可校验并可重下载。
    - date: 07/31（周五）
      focus: 真实基线执行
      work: 实现并运行基线代码，保存参数、种子、日志、环境和首批指标；指标必须从真实输出解析。
      deliverable: Baseline Run 包。
      evidence: 实际运行成功或失败均有原始日志，不得手填指标。
    - date: 08/01（周六）
      focus: 产物管理与 Draft PR-B
      work: 保存模型/表格/图、包版本、Git SHA 和 artifact URI；实现 actual_execution 守卫、失败分类和重试清理；开启 Draft PR-B。
      deliverable: ArtifactManifest；失败分类；Draft PR-B。
      evidence: 失败不能误置 true；产物一键定位。
    - date: 08/02（周日）
      focus: 鲁棒性与故障注入
      work: 测试超时、OOM 模拟、非法路径、坏数据、缺包和重复运行；完成 T06 配对审查。
      deliverable: 故障注入报告；配对审查记录。
      evidence: 失败安全、可解释、可清理。
    - date: 08/03（周一）
      focus: 工作流联调与 Round 1
      work: 与 T02 集成 ExecutionResult，确保结果摘要和指标进入 revision context；完成 Round 1 正式运行和分析。
      deliverable: E2E hook；Round 1 结果包。
      evidence: 结果可改变下一轮；Round 1 可从干净环境复跑。
    - date: 08/04（周二）
      focus: 反馈分析
      work: 基于 Round 1 结果提出具体修改，记录每项修改与证据；准备 Round 2 配置和预期判据。
      deliverable: Round 1→Round 2 变更说明。
      evidence: 不是重复同一配置；修改有数据依据。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步 integration，运行模块/契约/E2E；固定数据与环境版本，补文档；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；Round 1 可复现包。
      evidence: P0/P1 关闭；分支 up to date。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: Round 2 与复现
      work: 新建 C 分支；执行修改后的实验，生成比较表、图和解释；在第二环境/容器从零复跑；20:00 前开启 Draft PR-C。
      deliverable: Round 2 正式产物；reproduction report；Draft PR-C。
      evidence: 关键指标在预设容差内；变更与结果对应。
    - date: 08/07（周五）
      focus: 交付联调
      work: 完成 T08 payload、T09 评测接口、数据说明、脚本、回滚和安全文档；处理 Codex/配对审查。
      deliverable: API/产物样例；演示 runbook v1。
      evidence: 下游可消费；无未登记共享修改。
    - date: 08/08（周六）
      focus: 完整两轮演示
      work: 跑完整两轮演示，记录耗时、成本、失败恢复和屏幕证据；同步 integration、全测试、@codex review，18:00 前转 Ready。
      deliverable: 两轮演示包；PR-C Ready。
      evidence: 全链路无人工伪造指标；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: Code Freeze 与交接
  work: 只处理队长、CI 或 Codex 指出的发布阻断；不得新增功能、改名公共接口、升级依赖或继续使用已合并旧分支。完成 handoff、复现命令、PR 链接、已知限制与回滚说明。
  deliverable: 阻断修复或“无变更”确认；最终 handoff 包。
  evidence: 无新增范围；P0/P1 关闭或由队长登记阻断；交付可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不得把模拟指标写成真实结果；不直接修改 pipeline.py，通过 ExecutionResult 交给 T02。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
