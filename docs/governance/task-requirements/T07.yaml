- t07/a-batch-contract
- t07/b-batch-core
- t07/c-batch-hardening
paired_reviewer: T08
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- 逐题独立 workspace/context、checkpoint、retry、resume、预算和模型路由。
- 标准输出覆盖 Problem、Rationale、Technical Details、Datasets Source/Target、Title、Abstract、Methods、Experiments、Results、References。
- 串题/重复/题文一致性/引用存在性/Mock 自动检查；125 目录、manifest total=125、索引、汇总、SHA-256 与 24 题随机抽查。
definition_of_done:
- 125/125 每题 question_id、标题、假设、领域数据集与题目对应，正式结果不得为 Mock。
- 每题至少 PDF/MD/JSON、evidence_cards.json、agent_trace.json；缺文件即失败。
- 相似度 >0.90 的结果进入人工审查；支持断点恢复，单题失败不重跑全部；24 题抽查完成。
