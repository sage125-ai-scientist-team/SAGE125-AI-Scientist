waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与批量审计
      work: 完成协作接入；检查 125 题源、现有 batch_manifest 和 3 个 Mock 串题；设计 per-question workspace、job state 和输出目录。
      deliverable: 批量审计；失败样例；T07 架构草图。
      evidence: 能识别同一疫情方案污染不同题目；分支来自最新 integration。
    - date: 07/28（周二）
      focus: Runner 契约与 Draft PR-A
      work: 设计 manifest、budget、resume、模型路由和标准字段；实现队列/checkpoint/retry/dry-run 骨架及红灯测试；开启 Draft PR-A。
      deliverable: Batch RFC；runner skeleton；Draft PR-A。
      evidence: dry-run 覆盖 125 ID；每题上下文强隔离。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 实现 resume、失败隔离、状态序列化和输出契约；同步 integration、测试并在 20:00 前转 Ready。
      deliverable: PR-A Ready；dry-run/resume 报告。
      evidence: 不调用 Mock 作为正式结果；缺字段自动失败。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 隔离与反污染
      work: 新建 B 分支；每题重置 memory/prompt/cache namespace，绑定 question_id/input hash；实现标题/摘要/假设 hash、相似度与关键词泄漏检查。
      deliverable: context isolation；contamination checker。
      evidence: 旧 3 题污染被稳定检出。
    - date: 07/31（周五）
      focus: 输出规范与 5 题真实运行
      work: 实现每题目录和 PDF/MD/JSON/evidence/trace 文件验证；运行 5 个真实题，记录 token、时间、失败和题文一致性。
      deliverable: output contract；5 题包。
      evidence: 5 题非 Mock 且题文一致；缺文件不进入 complete。
    - date: 08/01（周六）
      focus: 预算、缓存与 Draft PR-B
      work: 实现 flash/plus/max 路由、文献解析缓存、每题 token/cost 上限；完成 T08 配对审查；开启 Draft PR-B。
      deliverable: budget controller；配对审查记录；Draft PR-B。
      evidence: 超预算安全失败；缓存不跨题污染。
    - date: 08/02（周日）
      focus: 恢复与 12 领域运行
      work: 测试断网、API 超时、单题失败、进程重启和重复提交；运行 12 个领域各 1 题并记录失败清单。
      deliverable: resume report；12 题包 v1。
      evidence: 不重跑已完成题；失败可恢复。
    - date: 08/03（周一）
      focus: 统一质量门
      work: 接入 T01/T03 证据、Schema、串题、重复和 Mock 检查，形成 per-question gate；生成失败回队列机制。
      deliverable: Batch QA pipeline。
      evidence: 失败题不进入 complete；错误可定位 owner。
    - date: 08/04（周二）
      focus: 12 领域验收与容量估算
      work: 修复 12 题失败项，统计通过率、成本和延迟；生成 24 题随机抽查清单；估算 125 正式运行资源。
      deliverable: 12-domain report；容量/成本估算；抽查清单。
      evidence: 12 题题文一致；资源风险明确。
    - date: 08/05（周三）
      focus: PR-B Ready 与冻结配置
      work: 冻结 prompt/model/schema 版本；同步 integration、全测试、@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；冻结记录。
      evidence: P0/P1 关闭；运行参数可追溯。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 启动 125 正式运行
      work: 新建 C 分支；启动 125 正式运行，加入状态监控、失败重试、manifest 和打包校验；20:00 前开启 Draft PR-C。
      deliverable: 正式运行状态表；Draft PR-C。
      evidence: 运行可监控、可暂停、可恢复。
    - date: 08/07（周五）
      focus: 全量监控与索引
      work: 继续运行和重试，检查串题、重复、缺文件；生成总索引、状态、耗时、成本和领域分布；处理审查。
      deliverable: 125 状态报告；index/manifest v1。
      evidence: 失败有原因和处置；可一键定位每题产物。
    - date: 08/08（周六）
      focus: 完成与冻结前验证
      work: 完成剩余题和失败重跑，运行 total=125、非 Mock、重复、引用和文件完整性校验；同步 integration、@codex review，18:00 前转 Ready。
      deliverable: 125/125 候选包；PR-C Ready。
      evidence: manifest total=125；无未处置串题；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: 人工抽查与最终交接
  work: 完成 24 题人工抽查、所有 SHA-256、汇总报告和 handoff；仅重跑被质量门明确判定失败的题，不再改变 Prompt/Schema。
  deliverable: 最终 125 结果包；抽查表；checksums；handoff。
  evidence: 125/125 非 Mock、题文一致、可检索；所有失败均已处置或登记阻断。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不得绕过 T01/T03 质量门，不得未记录地修改提示词/模型版本，不得将 Mock 标为正式结果。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
