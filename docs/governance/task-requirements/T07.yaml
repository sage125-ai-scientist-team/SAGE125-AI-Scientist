- app/batch/**
- scripts/batch_125/**
- app/contracts/batch.py
- tests/batch/**
- docs/modules/T07/**
forbidden_paths:
- 不得绕过 T01/T03 质量门，不得未记录地修改提示词/模型版本，不得将 Mock 标为正式结果
