title: T07. 队员 7（姓名待填）— 125 问题批量生成、隔离、去串题与交付索引
mission: 构建可恢复、可预算、逐题隔离的批量引擎，并在 8 月 9 日交付 125/125 独立、非 Mock、题文一致的标准研究计划及索引。
