- requirement_id: T08-METRIC-005
  raw_text: 2 小时
  comparator: quantity
  value: 2
  unit: 小时
  source_requirement_id: T08-C-004
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与现状盘点
      work: 完成协作接入；盘点 API 路由、Streamlit、导出、启动日志和 8501 端口问题；建立基础 health/API/前端冒烟。
      deliverable: 接口清单；失败复现；T08 信息架构草图。
      evidence: 现有入口可重复启动或失败；分支来自最新 integration。
    - date: 07/28（周二）
      focus: 契约与异步骨架
      work: 设计 Job、Status、Artifact、Version、Feedback API 和 UI flow；实现任务 ID、状态存储、队列抽象和 correlation_id；开启 Draft PR-A。
      deliverable: OpenAPI RFC；async skeleton；Draft PR-A。
      evidence: 请求不阻塞长任务；契约与 T02/T03/T05/T06 对齐。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 提交 API Schema、health/OpenAPI、基础测试和错误结构；同步 integration、测试并在 20:00 前转 Ready。
      deliverable: PR-A Ready；接口冻结记录。
      evidence: OpenAPI 可访问；无上游内部对象泄漏。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 核心 API
      work: 新建 B 分支；实现 run/status/artifacts/questions，输入验证、幂等键和错误码；提供 curl 示例。
      deliverable: API v1。
      evidence: 代表性请求可复制运行；失败状态清楚。
    - date: 07/31（周五）
      focus: 反馈/版本与证据 UI
      work: 接入 T03 feedback、T02 versions/diff；展示证据原文、来源、页码、支持状态和低置信度警告。
      deliverable: feedback/version endpoints；Evidence panel。
      evidence: 反馈可追踪到新版本；不只展示标题。
    - date: 08/01（周六）
      focus: 闭环 UI 与 Draft PR-B
      work: 展示 Reviewer issue、V1/V2 diff、validation gate、T05 日志/指标、T06 原图/提取值/单位；完成 T07 配对审查；开启 Draft PR-B。
      deliverable: Execution/Multimodal panels；Draft PR-B。
      evidence: 真实/模拟状态严格区分；闭环状态可视化。
    - date: 08/02（周日）
      focus: 专业导出
      work: 改造 PDF 排版、Markdown 清洗、分页、字体、目录和引用链接；增加 MD/JSON 导出一致性测试。
      deliverable: 新版 report.pdf；导出回归。
      evidence: 无裸符号、空白页、字距异常；事实引用可点击。
    - date: 08/03（周一）
      focus: 恢复、并发与权限
      work: 补失败恢复、重试、下载权限、最小鉴权、速率限制和 API 集成测试；测试 5 并发任务。
      deliverable: 并发/恢复报告。
      evidence: 状态不丢失；超时/失败可见且可重试。
    - date: 08/04（周二）
      focus: 全链路 E2E
      work: 运行“启动任务→查看证据/版本→提交反馈→新版本→执行/多模态→导出”完整流程；与上游逐项对齐。
      deliverable: E2E 录像/trace v1。
      evidence: 接口与 UI 不伪造结果；跨模块字段完整。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步 integration、运行 API/前端/导出/最小 E2E；补错误码、迁移和限制；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；接口回归报告。
      evidence: P0/P1 关闭；分支 up to date。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 容器化与干净部署
      work: 新建 C 分支；完成 Dockerfile/compose、healthcheck、持久卷、.env 使用说明和第二环境部署；20:00 前开启 Draft PR-C。
      deliverable: 一键部署包；clean deployment report；Draft PR-C。
      evidence: 干净机可启动；镜像无生产密钥。
    - date: 08/07（周五）
      focus: 稳定性与演示材料
      work: 执行 5 并发、2 小时运行、断网/重启恢复和资源泄漏测试；整理 API 说明、截图、代表性输入输出与回滚。
      deliverable: 稳定性报告；演示 runbook v1。
      evidence: 状态不丢失；赛事材料可直接使用。
    - date: 08/08（周六）
      focus: 冻结前演示
      work: 完整走通运行、反馈、版本变化、执行、多模态和导出；制作 10 分钟内演示草稿和备用录屏；同步 integration、@codex review，18:00 前转 Ready。
      deliverable: 演示 runbook；录像草稿；PR-C Ready。
      evidence: 10 分钟内讲清闭环；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: 部署交接与冻结
  work: 只修发布阻断；提供稳定地址或一键启动、健康检查、备用录屏、最终 API 示例和 handoff。
  deliverable: 最终部署包；handoff。
  evidence: 评委入口稳定可访问；无新增功能；可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不得在 UI 层伪造状态或结果；不直接改 T02/T03/T05/T06 内部，只通过契约消费。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
