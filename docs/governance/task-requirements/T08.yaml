schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T08
title: T08. 队员 8（姓名待填）— 可调用 API、交互前端、异步任务、导出与部署
mission: 将 FastAPI/Streamlit 工程升级为评委可稳定调用、可观察证据与版本、可提交反馈并可下载专业产物的一体化演示入口。
scoring_dimensions:
- 应用潜力
- 演示交付
- 交互体验
- 多模态展示
owner_paths:
- app/api/**
- frontend/**
- app/export/**
- Dockerfile
- compose.yaml
- tests/api/**
- docs/deployment/**
forbidden_paths:
- 不得在 UI 层伪造状态或结果
- 不直接改 T02/T03/T05/T06 内部，只通过契约消费
dependencies:
  raw: 消费 T01-T07；与 T09 联调部署和验收。
  upstream:
  - T01
  - T07
  - T09
  downstream: []
branch_series:
- t08/a-delivery-contract
- t08/b-delivery-core
- t08/c-delivery-hardening
paired_reviewer: T07
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- health、questions、run、status、feedback、versions/diff、artifacts、export API；OpenAPI 与可复制示例。
- 异步任务状态、超时、失败恢复、correlation_id、最小鉴权和速率限制。
- 前端展示证据、Reviewer 问题、V1/V2 diff、真实执行、多模态和人工反馈；专业 PDF/MD/JSON；Docker 一键启动。
definition_of_done:
- 评委可通过测试 API 提交任务、查询状态并取回结果。
- 前端完成“运行→证据/版本→反馈→新版本→导出”闭环；5 并发状态不丢失，2 小时稳定测试通过。
- PDF 无异常字距、裸 Markdown、空白页；干净电脑按 README/Docker 启动，密钥不进镜像。
quantitative_thresholds:
- requirement_id: T08-METRIC-001
  raw_text: 5 并发
  comparator: quantity
  value: 5
  unit: 并发
  source_requirement_id: T08-DOD-002
- requirement_id: T08-METRIC-002
  raw_text: 2 小时
  comparator: quantity
  value: 2
  unit: 小时
  source_requirement_id: T08-DOD-002
- requirement_id: T08-METRIC-003
  raw_text: 5 并发
