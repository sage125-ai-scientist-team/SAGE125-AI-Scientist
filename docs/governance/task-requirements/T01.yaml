waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与基线审计
      work: 完成邀请、Fork、Clone、upstream 配置和基线测试；复现 Q028 的虚构证据 ID、标题充当证据、正文未进入智能体等问题；盘点 EvidenceCard 与证据目录生成逻辑。
      deliverable: 接入完成回执；失败样例清单；T01 审计笔记。
      evidence: 至少固定 3 个可重复失败样例；任务分支从最新 upstream/integration 创建。
    - date: 07/28（周二）
      focus: 契约与红灯测试
      work: 设计 EvidenceCard v2、ClaimEvidenceLink、EvidenceBundle 和 token 预算字段；建立 20 条初始事实—证据对；编写不存在 ID、标题-only、问题册证据和跨域外推红灯测试；开启 Draft PR-A。
      deliverable: docs/contracts/T01.md；Schema 示例；红灯测试；Draft PR-A。
      evidence: 字段覆盖来源、原文、定位、哈希和支持关系；旧代码稳定失败。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 实现 Schema、序列化、兼容读取和迁移说明；与 T04/T02 对齐接口；同步最新 integration、运行契约与单测，20:00 前将 PR-A 转 Ready。
      deliverable: PR-A Ready；接口冻结记录。
      evidence: 无 pipeline.py 越权；CI 可运行；新 push 后重新请求审查。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 全文上下文构建
      work: 从最新 integration 新建 B 分支；实现 quote、页码/章节、作者、年份、来源类型与内容哈希进入受控上下文；记录截断原因、token 预算和缺失字段。
      deliverable: EvidenceBundle builder。
      evidence: quoted_text 不再被删除；输入可审计且不暴露无关全文。
    - date: 07/31（周五）
      focus: 支持关系判定
      work: 实现 claim-to-evidence 绑定、证据 ID 存在性、metadata-only 拒绝、问题册排除、语义不蕴含与跨域外推检查。
      deliverable: 支持检查器、错误码和失败夹具。
      evidence: 至少 5 类坏引用被阻断；不确定项被降级而非伪装通过。
    - date: 08/01（周六）
      focus: 引用展示与 Draft PR-B
      work: 实现报告/API 中的可点击来源、页码/章节、原文片段和支持状态；向 T08 提供 payload；扩展黄金集并开启 Draft PR-B。
      deliverable: 引用渲染器；API 契约；Draft PR-B。
      evidence: 样例可从结论一键回到证据；PR 清楚列出上游版本。
    - date: 08/02（周日）
      focus: Q028 回归与审查
      work: 运行 Q028 回归，比较修复前后；处理 Codex 与 T04 配对审查；优化片段去重、排序、截断和错误信息。
      deliverable: Q028 回归报告 v1；审查修订提交。
      evidence: 不存在虚构 ID；无支持结论明确标红或降级。
    - date: 08/03（周一）
      focus: 链路集成
      work: 与 T02/T03 联调 EvidenceBundle、版本记录和 Validator；补充 V1/V2、缺证据、冲突证据端到端测试。
      deliverable: E2E 测试；接口冻结记录。
      evidence: 证据贯穿生成、修订和验证；无隐性字段丢失。
    - date: 08/04（周二）
      focus: 指标与跨领域抽查
      work: 黄金集扩展至 30 条，计算精确率、拒绝率和未决样本；对 12 个领域代表题抽查题目相关性和跨域外推。
      deliverable: metrics.json；12 题抽查表。
      evidence: 精确率达到 90% 或有明确降级策略；每题证据与题目一致。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步最新 integration，运行模块、契约和最小 E2E；补齐迁移、回滚与性能说明；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；最终指标报告。
      evidence: 分支 up to date；P0/P1 关闭；结果可复跑。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 质量门加固
      work: PR-B 合并后新建 C 分支；接入冲突/反例证据、撤稿/来源状态占位、内容哈希缓存与确定性测试；20:00 前开启 Draft PR-C。
      deliverable: 质量门增量；缓存与确定性测试；Draft PR-C。
      evidence: 冲突证据不被静默覆盖；同输入证据集合稳定。
    - date: 08/07（周五）
      focus: 发布联调
      work: 完成 125 输出序列化、API 示例、性能报告、模块文档；与 T07/T08 联调；处理跨模块审查和冲突。
      deliverable: API/输出样例；性能报告；审查修订提交。
      evidence: 全部证据字段可序列化；无未登记共享文件修改。
    - date: 08/08（周六）
      focus: 冻结前核验
      work: 逐条核验 Q028、旗舰案例及 3 个随机题的关键事实；同步 integration、全测试、@codex review，18:00 前转 Ready。
      deliverable: 人工核验签字表；PR-C Ready。
      evidence: 关键事实 100% 有原文定位；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: Code Freeze 与交接
  work: 只处理队长、CI 或 Codex 指出的发布阻断；不得新增功能、改名公共接口、升级依赖或继续使用已合并旧分支。完成 handoff、复现命令、PR 链接、已知限制与回滚说明。
  deliverable: 阻断修复或“无变更”确认；最终 handoff 包。
  evidence: 无新增范围；P0/P1 关闭或由队长登记阻断；交付可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不得直接修改 app/workflow/pipeline.py；工作流接入由 T02 根据冻结接口完成。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
