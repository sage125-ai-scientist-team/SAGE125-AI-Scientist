schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T01
title: T01. 队员 1（姓名待填）— 证据全文注入、事实蕴含与可追溯引用
mission: 将仅含标题和元数据的检索结果升级为可被后续智能体读取、逐条核验并回链到文献原文位置的证据系统。
scoring_dimensions:
- 科学价值
- 事实准确性
- 引用可靠性
- 结果可复现性
owner_paths:
- app/evidence/**
- app/contracts/evidence.py
- tests/evidence/**
- docs/modules/T01/**
forbidden_paths:
- 不得直接修改 app/workflow/pipeline.py
- 工作流接入由 T02 根据冻结接口完成
dependencies:
  raw: 上游 T04；下游 T02、T03、T07、T08。
  upstream:
  - T04
  downstream:
  - T02
  - T03
  - T07
  - T08
branch_series:
- t01/a-evidence-contract
- t01/b-evidence-core
- t01/c-evidence-hardening
paired_reviewer: T04
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- EvidenceCard、ClaimEvidenceLink、EvidenceBundle：包含 source_id、quote、page/section/locator、DOI/URL、作者、年份、内容哈希、支持关系、置信度与 token 截断记录。
- 全文证据受控进入 EvidenceExtractor、HypothesisGenerator、ExperimentDesigner；标题、DOI 和问题册不得单独支持事实。
- 事实—证据支持检查器、可点击引用渲染、Q028 回归案例和 30 条人工标注黄金集。
definition_of_done:
- 代表性报告中的事实性结论均可回到文献、页码/章节与原文片段；证据 ID 必须真实存在。
- 30 条黄金样本支持关系精确率目标不低于 90%；不确定结论必须降级为“待核验”。
- Q028 不再出现不存在的 booklet_excerpt_Q028，也不得将单一癌种证据无条件外推到所有癌症。
