schema_version: 1
repository: sage125-ai-scientist-team/SAGE125-AI-Scientist
task_id: T06
title: T06. 队员 6（姓名待填）— 科学多模态数据处理与可校验推理
mission: 增加真正的科学多模态能力，至少处理论文表格/图表与 CSV/时序数据两类非纯文本输入，并保留来源、单位与校验信息。
scoring_dimensions:
- 多模态技术深度
- 科学数据处理
- 应用展示
owner_paths:
- app/multimodal/**
- app/contracts/multimodal.py
- tests/multimodal/**
- docs/modules/T06/**
forbidden_paths:
- 不负责全局 RAG 存储（T04）或工作流编排（T02）
- 通过 MultimodalArtifact 交付
dependencies:
  raw: 上游科学图表/表格/时序数据；下游 T01、T02、T07、T08。
  upstream: []
  downstream:
  - T01
  - T02
  - T07
  - T08
branch_series:
- t06/a-multimodal-contract
- t06/b-multimodal-core
- t06/c-multimodal-hardening
paired_reviewer: T05
sprint_days: 14
workload_note: 14 个冲刺日；PR-A、PR-B、PR-C；1 次配对审查；1 份最终 handoff；每天均提交测试或验证证据。
must_deliver:
- MultimodalArtifact：模态、来源、页码、bbox/坐标轴、单位、图例、数据数组、置信度和校验状态。
- PDF 表格/图表解析与 Qwen 视觉调用审计；CSV/时序清洗、字段/单位对齐、缺失和异常检测。
- 人工/规则校验、两个真实代表案例和量化提取准确率/误差。
definition_of_done:
- 至少两种非纯文本科学模态实际进入推理，不以文件名或 OCR 文本冒充多模态。
- 表格样本单元格精确匹配目标 ≥95%；图表数值相对误差目标 ≤5%，未达标须标记人工核验。
- 错误坐标轴、单位冲突、缺图例和低置信度不得静默通过；调用审计不暴露密钥。
quantitative_thresholds:
- requirement_id: T06-METRIC-001
  raw_text: 至少两种
  comparator: at_least
  value: 2
  unit: 种
  source_requirement_id: T06-DOD-001
- requirement_id: T06-METRIC-002
  raw_text: ≥95%
  comparator: at_least
  value: 95
  unit: '%'
  source_requirement_id: T06-DOD-002
- requirement_id: T06-METRIC-003
  raw_text: ≤5%
  comparator: at_most
  value: 5
  unit: '%'
  source_requirement_id: T06-DOD-002
- requirement_id: T06-METRIC-004
  raw_text: 至少 3 个
  comparator: at_least
  value: 3
  unit: 个
  source_requirement_id: T06-A-003
waves:
  A:
    label: Wave A / PR-A
    date_range: 07/27-07/29
    team_goal: 邀请接入、基线审计、契约/Schema、红灯测试、最小骨架。
    completion_condition: 07/28 开 Draft；07/29 20:00 前 Ready。
    days:
    - date: 07/27（周一）
      focus: 接入与模态选型
      work: 完成协作接入；选定 PDF 表格/图表和 CSV/时序两类模态，建立真实与合成夹具，明确人工真值和评价方法。
      deliverable: 样本清单；T06 任务笔记。
      evidence: 每类至少 3 个可核验样本；分支来自最新 integration。
    - date: 07/28（周二）
      focus: 数据契约与骨架
      work: 设计 MultimodalArtifact、provenance、bbox/axis、unit、confidence；实现模态识别、处理队列和 Qwen 视觉适配抽象；编写红灯测试；开启 Draft PR-A。
      deliverable: 接口 RFC；adapter skeleton；Draft PR-A。
      evidence: T01/T04/T08 可消费；密钥不写入代码。
    - date: 07/29（周三）
      focus: PR-A 完成
      work: 提交 Schema、fixtures、基础测试和安全日志字段；同步 integration、测试并在 20:00 前转 Ready。
      deliverable: PR-A Ready；接口冻结记录。
      evidence: 来源、单位、坐标和置信度字段完整。
  B:
    label: Wave B / PR-B
    date_range: 07/30-08/05
    team_goal: 核心实现、单测、最小 E2E、指标、真实案例或 12 领域验证。
    completion_condition: 08/01 开 Draft；08/05 20:00 前 Ready。
    days:
    - date: 07/30（周四）
      focus: 表格提取
      work: 新建 B 分支；实现 PDF 页码/bbox、表头、单元格、合并单元格、单位提取和结构化输出。
      deliverable: table extractor。
      evidence: 来源定位完整；表格结构可复核。
    - date: 07/31（周五）
      focus: 图表解析
      work: 识别坐标轴、图例、曲线/柱值、置信度、数值范围与单位；对缺图例和错误轴设置失败状态。
      deliverable: chart extractor。
      evidence: 错误轴/图例可被发现；不静默给值。
    - date: 08/01（周六）
      focus: 时序清洗与 Draft PR-B
      work: 实现 CSV schema、时间索引、缺失、重复、单位转换和异常标记；把多模态结果转换为受控证据/数据摘要；开启 Draft PR-B。
      deliverable: time-series adapter；摘要转换器；Draft PR-B。
      evidence: 无二进制直接进入 prompt；清洗日志可追溯。
    - date: 08/02（周日）
      focus: 黄金校验
      work: 人工标注表格/图表真值，计算单元格准确率和数值误差；完成 T05 配对审查。
      deliverable: multimodal gold set；初始指标。
      evidence: 指标计算脚本可复现；误差样本可定位。
    - date: 08/03（周一）
      focus: RAG/证据联调
      work: 与 T04/T01 接入索引和 EvidenceCard，保留 bbox、单位、来源和置信度；补契约/E2E。
      deliverable: 接口测试；跨模块样例。
      evidence: 跨模块字段不丢失；低置信度不支持事实。
    - date: 08/04（周二）
      focus: 视觉审计与人工节点
      work: 完成 Qwen 视觉模型、时间、输入摘要、输出、成本审计；向 T02 提供摘要和验证结论，低置信度触发人工确认。
      deliverable: 调用审计；workflow hook。
      evidence: 审计可用于赛事材料且不暴露凭证。
    - date: 08/05（周三）
      focus: PR-B Ready
      work: 同步 integration、运行指标/契约/E2E；补性能和限制；@codex review，20:00 前转 Ready。
      deliverable: PR-B Ready；核心评测报告。
      evidence: P0/P1 关闭；分支 up to date。
  C:
    label: Wave C / PR-C
    date_range: 08/06-08/08
    team_goal: 安全、稳定、性能、跨领域抽查、部署、文档和发布证据。
    completion_condition: 08/06 开 Draft；08/08 18:00 前 Ready。
    days:
    - date: 08/06（周四）
      focus: 真实案例与前端契约
      work: 新建 C 分支；完成一个论文表格/图表案例和一个时序/CSV 案例；向 T08 提供缩略图、来源定位、原始/提取值 payload；开启 Draft PR-C。
      deliverable: 两个案例包；UI contract；Draft PR-C。
      evidence: 输入、输出与人工真值齐全。
    - date: 08/07（周五）
      focus: 性能与安全降级
      work: 测试性能、配额、超时、无视觉模型、失败回退和单位冲突；完善模块文档与纠错流程。
      deliverable: 性能/失败回退报告；审查修订提交。
      evidence: 无视觉模型时安全降级；不产生伪结果。
    - date: 08/08（周六）
      focus: 冻结前评测
      work: 运行最终准确率、误差、单位冲突和人工纠错回归；同步 integration、全测试、@codex review，18:00 前转 Ready。
      deliverable: 最终评测报告；PR-C Ready。
      evidence: 达到目标或明确人工核验标记；P0/P1 关闭。
code_freeze:
  date: 08/09（周日）
  focus: Code Freeze 与交接
  work: 只处理队长、CI 或 Codex 指出的发布阻断；不得新增功能、改名公共接口、升级依赖或继续使用已合并旧分支。完成 handoff、复现命令、PR 链接、已知限制与回滚说明。
  deliverable: 阻断修复或“无变更”确认；最终 handoff 包。
  evidence: 无新增范围；P0/P1 关闭或由队长登记阻断；交付可在干净环境复现。
handoff:
- handoff.md 写明模块目的、入口、关键类/函数、配置、测试、运行、失败处理、已知限制、回滚和后续 Issue。
- 列出 PR-A/PR-B/PR-C、最终 integration commit、测试命令和结果。
- 所有截图、trace 和指标必须对应当前 Commit，不得使用旧 Mock 或旧失败产物。
- 队长能够在干净环境按 handoff 命令验证；无法复现不计为完成。
conflict_boundary: 不负责全局 RAG 存储（T04）或工作流编排（T02）；通过 MultimodalArtifact 交付。 全局停止条件：冲突涉及其他任务路径、队长专属文件、破坏性公共 Schema、真实密钥或无许可数据时，必须停止自行处理并联系队长（手册 5.x）。
