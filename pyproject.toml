[project]
name = "sage125-ai-scientist"
version = "0.1.0"
description = "Evidence-grounded multi-agent AI Scientist for the 125 Questions booklet"
requires-python = ">=3.10,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "data/cache/pytest-cache"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the initial gate focused on correctness; no paths or rules are ignored.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Full-suite baseline on 2026-07-30: 65.08%.  Raise this integer gate only
# after a later full-suite measurement demonstrates a higher sustainable floor.
fail_under = 65
precision = 2
