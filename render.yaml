previews:
  generation: off

projects:
  - name: SAGE125-AI-Scientist-Preview
    environments:
      - name: preview
        services:
          - type: web
            name: sage125-api-preview
            runtime: python
            repo: https://github.com/sage125-ai-scientist-team/SAGE125-AI-Scientist
            branch: integration/2026-08-10
            plan: free
            region: singapore
            autoDeployTrigger: checksPass
            buildCommand: pip install -r requirements.txt
            startCommand: python -m scripts.start_api
            healthCheckPath: /health
            envVars:
              - key: APP_ENV
                value: preview
              - key: LOG_LEVEL
                value: INFO
              - key: LLM_PROVIDER
                value: bailian
              - key: DASHSCOPE_REGION
                value: cn-beijing
              - key: QWEN_FAST_MODEL
                value: qwen3.6-flash
              - key: QWEN_BALANCED_MODEL
                value: qwen3.7-plus
              - key: QWEN_STRONG_MODEL
                value: qwen3.7-max
              - key: QWEN_DEEP_RESEARCH_MODEL
                value: qwen-deep-research
              - key: EMBEDDING_BACKEND
                value: bailian
              - key: BAILIAN_EMBEDDING_MODEL
                value: text-embedding-v4
              - key: BAILIAN_RERANK_MODEL
                value: qwen3-rerank
              - key: MOCK_LLM
                value: "false"
              - key: DATA_DIR
                value: /tmp/sage125/data
              - key: EXPORT_DIR
                value: /tmp/sage125/exports
              - key: PREVIEW_EPHEMERAL_STORAGE
                value: "true"
              - key: SAGE125_PREVIEW_SEED
                value: "1"

          - type: web
            name: sage125-ui-preview
            runtime: python
            repo: https://github.com/sage125-ai-scientist-team/SAGE125-AI-Scientist
            branch: integration/2026-08-10
            plan: free
            region: singapore
            autoDeployTrigger: checksPass
            buildCommand: pip install -r requirements.txt
            startCommand: python -m scripts.start_ui
            healthCheckPath: /_stcore/health
            envVars:
              - key: APP_ENV
                value: preview
              - key: LOG_LEVEL
                value: INFO
              - key: FRONTEND_RUN_VIA_API
                value: "1"
              - key: FRONTEND_API_SHORT_TIMEOUT_SECONDS
                value: "10"
              - key: FRONTEND_API_WAKE_TIMEOUT_SECONDS
                value: "75"
              - key: FRONTEND_INGEST_TIMEOUT_SECONDS
                value: "900"

  - name: SAGE125-Final-Demo
    environments:
      - name: production
        services:
          - type: web
            name: sage125-final-api
            runtime: docker
            plan: starter
            region: singapore
            branch: release/2026-sage125-final-demo
            autoDeployTrigger: checksPass
            dockerfilePath: ./Dockerfile.api
            dockerContext: .
            healthCheckPath: /health
            envVars:
              - key: APP_ENV
                value: competition_demo
              - key: DEMO_MODE
                value: FROZEN_RELEASE_CANDIDATE
              - key: FORMAL_125_READ_ONLY
                value: "true"
              - key: ALLOW_PUBLIC_ACTUAL_RUN
                value: "false"
              - key: ALLOW_PUBLIC_PROVIDER_CALL
                value: "false"
              - key: PUBLIC_FEEDBACK_WRITE_ENABLED
                value: "false"
              - key: RC_MANIFEST_RELATIVE_PATH
                value: deployment/frozen_rc/manifest.json
              - key: LOG_LEVEL
                value: INFO
              - key: PYTHONUTF8
                value: "1"
              - key: CORS_ALLOW_ORIGINS
                value: https://sage125-final-ui.onrender.com

          - type: web
            name: sage125-final-ui
            runtime: docker
            plan: starter
            region: singapore
            branch: release/2026-sage125-final-demo
            autoDeployTrigger: checksPass
            dockerfilePath: ./Dockerfile.ui
            dockerContext: .
            healthCheckPath: /health
            envVars:
              - key: APP_ENV
                value: competition_demo
              - key: DEMO_MODE
                value: FROZEN_RELEASE_CANDIDATE
              - key: FORMAL_125_READ_ONLY
                value: "true"
              - key: ALLOW_PUBLIC_ACTUAL_RUN
                value: "false"
              - key: ALLOW_PUBLIC_PROVIDER_CALL
                value: "false"
              - key: PUBLIC_FEEDBACK_WRITE_ENABLED
                value: "false"
              - key: LOG_LEVEL
                value: INFO
              - key: PYTHONUTF8
                value: "1"
              - key: SAGE_INTERNAL_API_URL
                fromService:
                  name: sage125-final-api
                  type: web
                  property: hostport
              - key: API_BASE_URL
                fromService:
                  name: sage125-final-api
                  type: web
                  property: hostport
